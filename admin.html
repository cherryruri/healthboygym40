<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>회원 관리</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0a0a0a;
  color:white;
  font-family:Pretendard,sans-serif;
  padding:40px;
}

h1{
  font-size:42px;
  margin-bottom:40px;
}

.member-list{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.member-card{
  background:#151515;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  padding:24px;
}

.member-card h2{
  font-size:24px;
  margin-bottom:10px;
}

.member-card p{
  opacity:0.7;
  margin-bottom:6px;
}

.delete-btn{
  margin-top:16px;
  background:#ff3b30;
  border:none;
  color:white;
  padding:10px 18px;
  border-radius:12px;
  cursor:pointer;
}

</style>
</head>
<body>

<h1>회원 신청 목록</h1>

<div class="member-list" id="memberList"></div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBzNC4YRafbmlipiYaBD9CqoMmf9bsugLg",
  authDomain: "healthboygym40.firebaseapp.com",
  projectId: "healthboygym40",
  storageBucket: "healthboygym40.firebasestorage.app",
  messagingSenderId: "202998639138",
  appId: "1:202998639138:web:8996d545c8f1e2df75b87b",
  measurementId: "G-T3ZBH2HTQF"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const memberList = document.getElementById("memberList");


async function loadMembers(){

  memberList.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "members"));

  querySnapshot.forEach((data) => {

    const member = data.data();

    const div = document.createElement("div");

    div.className = "member-card";

    div.innerHTML = `
      <h2>${member.name}</h2>
      <p>전화번호 : ${member.phone}</p>
      <p>운동목표 : ${member.goal}</p>

      <button class="delete-btn" data-id="${data.id}">
        삭제
      </button>
    `;

    memberList.appendChild(div);

  });


  document.querySelectorAll(".delete-btn").forEach((btn)=>{

    btn.addEventListener("click", async ()=>{

      const ok = confirm("삭제하시겠습니까?");

      if(!ok) return;

      await deleteDoc(doc(db, "members", btn.dataset.id));

      loadMembers();

    });

  });

}

loadMembers();

</script>

</body>
</html>
