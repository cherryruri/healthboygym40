<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시판</title>

<link rel="stylesheet" href="style.css?v=20260705-review-flow16">
<link rel="stylesheet" href="board.css?v=20260618-intro-facility-tabs">
</head>
<body class="loaded">

<header>
  <nav class="navbar">
    <div class="logo">
      <a href="index.html">HEALTHBOYGYM</a>
    </div>

    <ul class="menu">
      <li><a href="index.html#about">센터 소개</a></li>
      <li><a href="index.html#brand">브랜드 소개</a></li>
      <li><a href="index.html#pass">올패스 안내</a></li>
      <li><a href="index.html#facility">시설 투어</a></li>
      <li><a href="index.html#trainer">트레이너 소개</a></li>
      <li><a href="index.html#hours">운영 시간</a></li>
      <li><a href="index.html#location">오시는 길</a></li>
      <li><a href="board.html">게시판</a></li>
      <li><a href="board.html?board=noticeboard">공지문/뉴스</a></li>
      <li><a href="index.html#newsHub">새 소식</a></li>

      <li id="userMenu">
        <a href="login.html" id="loginLink">LOGIN</a>
        <button id="logoutBtn" style="display:none;">LOGOUT</button>
      </li>
    </ul>

    <a href="https://map.naver.com/p/search/%ED%97%AC%EC%8A%A4%EB%B3%B4%EC%9D%B4%EC%A7%90%20%EC%88%98%EB%82%B4%EC%A0%90" target="_blank" class="download-btn">
      네이버 문의 및 예약 바로가기
    </a>
  </nav>
</header>

<section class="board-page" data-board-mode="consult" data-board="free">
<div class="board-layout">

  <div class="board-main">
    <div class="board-header">
      <h1>자유게시판</h1>
      <p id="boardDesc">
        헬스보이짐 수내점 회원님들의 자유로운 이야기와 후기를 확인하는 공간입니다.
      </p>
    </div>

    <div id="boardCategoryBar" class="board-category-bar">
      <button type="button" class="active" data-category="all">전체</button>
      <button type="button" data-category="free">자유게시판</button>
      <button type="button" data-category="praise">칭찬합니다</button>
      <button type="button" data-category="pt">PT후기</button>
      <button type="button" data-category="request">건의 사항</button>
    </div>

    <div class="board-table">
      <div class="board-row board-head">
        <div>No</div>
        <div>제목</div>
        <div>글쓴이</div>
        <div>작성시간</div>
        <div>조회수</div>
      </div>
      <div id="noticeList"></div>
      <div id="postList"></div>
    </div>

    <div class="board-bottom">
      <input type="text" id="boardSearch" placeholder="Search">
      <button id="writeBtn" class="write-btn">글쓰기</button>
    </div>

    <div id="pagination" class="pagination"></div>
  </div>

</div>
</section>

<script src="site-menu.js?v=20260705-review-flow16"></script>
<script type="module" src="firebase-index.js?v=20260705-review-flow16"></script>
<script type="module" src="board.js?v=20260702-infoboard" defer></script>

<script>
  window.addEventListener('load', () => {
    const logoScreen = document.querySelector('.logo-screen');
    if (logoScreen) {
      // 1. 자연스럽게 투명해지는 애니메이션 효과 부여
      logoScreen.style.opacity = '0';
      logoScreen.style.transition = 'opacity 0.5s ease-out';
      
      // 2. 애니메이션이 끝난 후(0.5초 뒤) 아예 화면에서 완전히 제거 (클릭 방해 방지)
      setTimeout(() => {
        logoScreen.style.display = 'none';
      }, 500);
    }
  });
</script>

</body>
</html>
