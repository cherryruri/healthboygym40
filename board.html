<head>

<link rel="stylesheet" href="style.css?v=20260618-mobile-menu-fit">
<link rel="stylesheet" href="board.css?v=500">
</head>
<body class="loaded">

<header>
  <nav class="navbar">
    <div class="logo">
      <a href="index.html">HEALTHBOYGYM</a>
    </div>

    <ul class="menu">
      <li><a href="index.html#about">센터 소개</a></li>
      <li><a href="index.html#brand">브랜드 소개</a></li>
      <li><a href="index.html#facility">시설 투어</a></li>
      <li><a href="index.html#pass">올패스 안내</a></li>
      <li><a href="index.html#trainer">트레이너 소개</a></li>
      <li><a href="index.html#hours">운영 시간</a></li>
      <li><a href="index.html#location">오시는 길</a></li>
      <li><a href="board.html">게시판</a></li>
      <li><a href="index.html#faq">자주 묻는 질문</a></li>

      <li id="userMenu">
        <a href="login.html" id="loginLink">LOGIN</a>
        <button id="logoutBtn" style="display:none;">LOGOUT</button>
      </li>
    </ul>

    <a href="https://map.naver.com/p/search/%ED%97%AC%EC%8A%A4%EB%B3%B4%EC%9D%B4%EC%A7%90%20%EC%88%98%EB%82%B4%EC%A0%90" target="_blank" class="download-btn">
      네이버 문의 및 예약 바로가기
    </a>
  </nav>
</header>

<section class="board-page">
<div class="board-layout">

  <aside class="board-sidebar">
    <button class="board-tab active" data-board="free">수내점 건의 사항</button>
    <button class="board-tab" data-board="praise">칭찬합니다</button>
    <button class="board-tab" data-board="noticeboard">수내점 공지사항</button>
    <button class="board-tab" data-board="review">리얼 후기</button>
    <button class="board-tab" data-board="teen">동기부여 모음</button>
    <button class="board-tab" data-board="news">헬스보이짐 뉴스</button>
  </aside>

  <div class="board-main">
    <div class="board-header">
      <h1>수내점 건의 사항</h1>
      <p id="boardDesc">
        헬스보이짐 수내점을 이용 중인 회원분들의 자유로운 건의 사항 게시판입니다.
        <br>
        기본적으로 비밀글로 표시 되어 있으며 빠른 시일 내에 답변드리도록 하겠습니다.
      </p>
    </div>

    <div class="board-table">
      <div class="board-row board-head">
        <div>No</div>
        <div>제목</div>
        <div>글쓴이</div>
        <div>작성시간</div>
        <div>조회수</div>
      </div>
      <div id="noticeList"></div>
      <div id="postList"></div>
    </div>

    <div class="board-bottom">
      <input type="text" id="boardSearch" placeholder="Search">
      <button id="writeBtn" class="write-btn">글쓰기</button>
    </div>

    <div id="pagination" class="pagination"></div>
  </div>

</div>
</section>

<script src="site-menu.js?v=20260618-mobile-menu-fit"></script>
<script type="module" src="firebase-index.js?v=20260618-mobile-board-menu"></script>
<script type="module" src="board.js?v=500" defer></script>

<script>
  window.addEventListener('load', () => {
    const logoScreen = document.querySelector('.logo-screen');
    if (logoScreen) {
      // 1. 자연스럽게 투명해지는 애니메이션 효과 부여
      logoScreen.style.opacity = '0';
      logoScreen.style.transition = 'opacity 0.5s ease-out';
      
      // 2. 애니메이션이 끝난 후(0.5초 뒤) 아예 화면에서 완전히 제거 (클릭 방해 방지)
      setTimeout(() => {
        logoScreen.style.display = 'none';
      }, 500);
    }
  });
</script>

</body>
</html>
