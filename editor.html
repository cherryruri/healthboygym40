<main class="editor-page">

  <div class="editor-header">
    <h1>글쓰기</h1>
    <p id="editorBoardName">수내점자유게시판</p>
  </div>

  <section class="editor-card">

    <div class="editor-thumbnail-field" id="editorThumbnailField" hidden>
      <div class="thumbnail-preview-panel">
        <strong>썸네일 미리보기</strong>
        <p>게시판 대표 사진은 중앙 기준 1:1 정사각형으로 자동 조정됩니다. 문구로 만들거나 사진을 선택해 주세요.</p>
        <div id="thumbnailPreview" class="thumbnail-preview" role="img" aria-label="게시판 썸네일 미리보기" hidden></div>
        <div class="thumbnail-image-actions">
          <label class="editor-thumbnail-drop">
            <input type="file" id="postThumbnail" accept="image/*">
            <span id="thumbnailLabel">이미지 선택</span>
          </label>
          <button type="button" id="removeThumbnail" class="thumbnail-remove" hidden>삭제</button>
        </div>
      </div>
      <div id="infoThumbnailMaker" class="info-thumbnail-maker">
        <label for="infoThumbnailText">썸네일 문구</label>
        <textarea id="infoThumbnailText" rows="2" maxlength="32" placeholder="비워 두면 글 제목 사용"></textarea>
        <label for="infoThumbnailHighlight">강조하고 싶은 단어</label>
        <input id="infoThumbnailHighlight" type="text" maxlength="14" placeholder="예시: 웰컴PT">
        <p>문구는 최대 32자, 4줄입니다. 원하는 위치에서 줄을 바꿀 수 있어요.</p>
        <div class="thumbnail-colors">
          <label>배경색 <input id="thumbnailBackground" type="color" value="#000000"></label>
          <label>강조색 <input id="thumbnailAccent" type="color" value="#ffce19"></label>
        </div>
        <button type="button" id="makeInfoThumbnail">썸네일 미리보기</button>
        <p id="infoThumbnailStatus" role="status"></p>
      </div>
    </div>

    <label class="editor-category-field" id="editorCategoryField" hidden>
      <span>분류</span>
      <select id="postCategory">
        <option value="info_fc">FC</option>
        <option value="info_pilates">필라테스</option>
        <option value="info_health">헬스</option>
        <option value="info_pt">PT</option>
      </select>
    </label>

    <input type="text" id="postTitle" class="editor-title-input" placeholder="제목을 입력하세요">
<div class="editor-toolbar">

<select id="fontSizeSelect">
  <option value="14">14</option>
  <option value="15" selected>15</option>
  <option value="16">16</option>
  <option value="18">18</option>
  <option value="20">20</option>
  <option value="24">24</option>
  <option value="28">28</option>
  <option value="32">32</option>
</select>






  <button type="button" data-command="bold"><b>B</b></button>
  <button type="button" data-command="underline"><u>U</u></button>
  <button type="button" data-command="strikeThrough"><s>ABC</s></button>

<button type="button" class="icon-btn" data-command="justifyLeft" title="왼쪽 정렬">⟵</button>
<button type="button" class="icon-btn" data-command="justifyCenter" title="가운데 정렬">≡</button>
<button type="button" class="icon-btn" data-command="justifyRight" title="오른쪽 정렬">⟶</button>


<button type="button" data-command="insertUnorderedList">• 리스트</button>
<button type="button" data-command="insertOrderedList">1. 리스트</button>
<select id="dividerSelect">
  <option value="">구분선</option>
  <option value="line">기본선</option>
  <option value="double">굵은선</option>
  <option value="diamond">◇ 구분선</option>
  <option value="dots">•••••</option>
</select>

<button type="button" class="color-btn" id="textColorBtn" title="글자색">A</button>
<input type="color" id="textColor" class="hidden-color">

<button type="button" class="color-btn bg" id="backColorBtn" title="배경색">▣</button>
<input type="color" id="backColor" class="hidden-color">



</div>

<div id="postContent" class="editor-content" contenteditable="true" data-placeholder="내용을 입력하세요"></div>

<label id="editorNoticeOption" class="editor-notice-option" hidden>
  <input type="checkbox" id="postIsNotice">
  <span class="editor-notice-check" aria-hidden="true"></span>
  <span class="editor-notice-copy">
    <strong>공지로 표시하기</strong>
    <small>체크하면 게시판 최상단에 강조되어 표시됩니다.</small>
  </span>
</label>

<div class="editor-actions">
  <a href="board.html" class="cancel-btn">취소</a>
  <button type="button" id="submitPost" class="submit-btn">등록하기</button>
</div>
