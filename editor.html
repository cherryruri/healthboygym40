<main class="editor-page">

  <div class="editor-header">
    <h1>글쓰기</h1>
    <p id="editorBoardName">수내점자유게시판</p>
  </div>

  <section class="editor-card">

    <input type="text" id="postTitle" class="editor-title-input" placeholder="제목을 입력하세요">
<div class="editor-toolbar">

<select id="fontSizeSelect">
  <option value="14">14</option>
  <option value="15" selected>15</option>
  <option value="16">16</option>
  <option value="18">18</option>
  <option value="20">20</option>
  <option value="24">24</option>
  <option value="28">28</option>
  <option value="32">32</option>
</select>






  <button type="button" data-command="bold"><b>B</b></button>
  <button type="button" data-command="underline"><u>U</u></button>
  <button type="button" data-command="strikeThrough"><s>ABC</s></button>

<button type="button" data-command="justifyLeft" title="왼쪽 정렬">☰</button>
<button type="button" data-command="justifyCenter" title="가운데 정렬">≡</button>
<button type="button" data-command="justifyRight" title="오른쪽 정렬">☷</button>

  <button type="button" data-command="insertUnorderedList">• 목록</button>
  <button type="button" data-command="insertOrderedList">1. 목록</button>
<button type="button" id="insertHrBtn">―</button>

  <input type="color" id="textColor" title="글자색">
<input type="color" id="backColor" title="배경색">

</div>

<div id="postContent" class="editor-content" contenteditable="true" data-placeholder="내용을 입력하세요"></div>

<div class="editor-actions">
  <a href="board.html" class="cancel-btn">취소</a>
  <button type="button" id="submitPost" class="submit-btn">등록하기</button>
</div>






  </section>
