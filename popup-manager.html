<main class="traffic-page popup-manager">
  <h1>팝업 관리</h1>
  <p id="access" role="status">관리자 권한 확인 중…</p>
  <section id="manager" hidden>
    <div class="popup-manager-layout">
      <form id="popup-form" class="traffic-card">
        <h2 id="form-title">팝업 추가</h2>
        <label for="popup-title">팝업 이름</label>
        <input id="popup-title" maxlength="80" required>
        <label for="popup-url">네이버 예약 링크</label>
        <input id="popup-url" type="url" inputmode="url" maxlength="1000" placeholder="https://m.booking.naver.com/booking/…" required>
        <label for="popup-image">팝업 이미지</label>
        <input id="popup-image" type="file" accept="image/png,image/jpeg,image/webp">
        <p class="traffic-note">닫기와 예약 버튼은 이미지 아래에 자동으로 표시됩니다.</p>
        <img id="popup-preview" alt="팝업 이미지 미리보기" hidden>
        <div class="popup-manager-actions">
          <button type="submit">저장</button>
          <button type="button" id="cancel-edit" hidden>수정 취소</button>
        </div>
      </form>
      <section class="traffic-card" aria-labelledby="published-title">
        <h2 id="published-title">게시 중인 팝업</h2>
        <div id="popup-list"></div>
        <a href="traffic.html">팝업별 방문 통계 보기</a>
      </section>
    </div>
    <p id="manager-status" role="status"></p>
  </section>
</main>
</body>
